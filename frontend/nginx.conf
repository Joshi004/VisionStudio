server {
    listen 80;
    server_name _;
    absolute_redirect off;
    root /usr/share/nginx/html;
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        set $backend_upstream http://backend:8000;   # no trailing slash, so the original URI is kept
        proxy_pass $backend_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 512m;
    }
    location /media/ {
        alias /data/media/;
        # A `types` block replaces the inherited map here, and the stock map has no entry
        # for wav or flac. Add every new stored file extension below.
        types {
            audio/wav  wav;
            audio/mpeg mp3;
            audio/mp4  m4a;
            audio/flac flac;
        }
        default_type application/octet-stream;
        add_header X-Content-Type-Options nosniff always;
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location / {
        try_files $uri /index.html;
    }
}
