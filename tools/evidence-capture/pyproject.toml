[project]
name = "visio-evidence-capture"
version = "1.0.0"
description = "Captures verified screenshots of web pages and PDFs, and video windows of YouTube quotes, for the Visio Studio evidence layer."
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "pillow>=12.3.0",
    "playwright>=1.50.0",
    "pypdfium2>=4.30.0",
    "yt-dlp[default]>=2026.10.26",
]

[project.scripts]
visio-evidence-capture = "visio_evidence_capture.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/visio_evidence_capture"]

[dependency-groups]
dev = [
    "ruff>=0.16.10",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
